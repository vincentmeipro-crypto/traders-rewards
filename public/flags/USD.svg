  <circle cx="1.2" cy="6" r="0.55" fill="#fff"/>
  <circle cx="2.8" cy="6" r="0.55" fill="#fff"/>
  <circle cx="4.4" cy="6" r="0.55" fill="#fff"/>
  <circle cx="6" cy="6" r="0.55" fill="#fff"/>
